# Watchtower — local compose
#
# One command: docker compose up --build
#
# Starts four processes on YOUR laptop:
#   db        Postgres 15 + pgvector     host port 54322
#   rest      PostgREST (HTTP in front
#             of the watchtower schema)  host port 54321
#   inngest   local background-job UI    host port 8288
#   watchtower leftover HTTP server      host port 5003
#
# The SUPABASE_ env names on the watchtower service are the
# leftover @supabase/supabase-js client's. They point at the
# `rest` container, not at supabase.com.
#
# Capture does not need ANTHROPIC_API_KEY or VOYAGE_API_KEY.
# Leave them empty.
#
# First boot applies migrations/ via docker-entrypoint-initdb.d.
# Human setup: README.md. Agent skill: AGENTS.md.

version: '3.8'

services:
  # PostgreSQL 15 with pgvector. A plain image on purpose: the
  # supabase/postgres image keeps its own role setup in
  # docker-entrypoint-initdb.d, which mounting migrations/ replaced,
  # so the `postgres` role never existed and PostgREST could not log in.
  db:
    image: pgvector/pgvector:0.8.0-pg15
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - watchtower-db:/var/lib/postgresql/data
      - ./docker/initdb/000_local_roles.sql:/docker-entrypoint-initdb.d/000_local_roles.sql:ro
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Supabase REST API (PostgREST)
  rest:
    image: postgrest/postgrest:v12.2.8
    ports:
      - "54321:3000"
    environment:
      PGRST_DB_URI: postgresql://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,watchtower
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      db:
        condition: service_healthy

  # Inngest dev server
  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    command: inngest dev -u http://watchtower:5003/api/inngest

  # Watchtower server
  watchtower:
    build: .
    ports:
      - "5003:5003"
    environment:
      # A bare PostgREST serves at /, not a Supabase project's /rest/v1.
      WATCHTOWER_REST_URL: http://rest:3000
      # Local stub for the `rest` container only: role=service_role signed with the  # git-secret-allow: names the role of the published local stub below, no credential
      # PGRST_JWT_SECRET above, which is Supabase's published default. It works
      # against this compose stack and nowhere else. The previous default was not
      # signed with that secret, so it never verified here and was removed as an
      # unknown credential (2026-09-21). Set SUPABASE_SERVICE_KEY for anything real.
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.M2d2z4SFn5C7HlJlaSLfrzuYim9nbY_XI40uWFN3hEE}  # git-secret-allow: signed with the published local default above; grants nothing outside this stack
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      # The local job runner is the `inngest` container, not 127.0.0.1.
      INNGEST_DEV: 1
      INNGEST_BASE_URL: http://inngest:8288
      PORT: 5003
    depends_on:
      db:
        condition: service_healthy
      inngest:
        condition: service_started

volumes:
  watchtower-db:
